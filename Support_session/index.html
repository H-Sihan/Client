<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Responsive Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/script.js" defer></script>
</head>

<body>
  <button id="toggleTheme" class="theme-toggle">🌙 Toggle Dark Mode</button>
  <header>
    <nav>
      <h1>My Portfolio</h1>
      <ul class="nav-links">
        <li><a href="#">Home</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="intro fade-in">
      <img src="assets/images/profile.jpg" alt="Profile" class="profile-img">
      <h2>Hello, I'm John Doe</h2>
      <p>I love web development and creating modern, responsive websites.</p>
      <button id="greetBtn">Greet Me</button>
    </section>
    <section id="contact" class="contact-section fade-in">
      <h2>Contact Me</h2>
      <form class="contact-form">
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required />
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
        <label for="message">Message:</label>
        <textarea id="message" name="message" rows="4" placeholder="Your message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 John Doe. All rights reserved.</p>
  </footer>
</body>

</html>
